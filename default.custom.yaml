# Rime default settings
# encoding: utf-8
# 仅保留与 default.yaml 不同的增量自定义项；其余配置（switcher 开关记忆、ascii_composer、
# key_binder 中的 Ctrl+k 释放与小键盘映射等）直接继承上游 default.yaml，避免整块覆盖阻碍上游更新。
patch:
  # 方案列表
  schema_list:
    - schema: wanxiang_pro

  # 候选词个数（不得超过 6 个，7890 代表声调）
  menu/page_size: 6

  # 网址/文件输入优化：支持输入字母/数字加点后不上屏
  "recognizer/patterns/url": "^[A-Za-z0-9]+[.].*$"
