# Rime custom settings
# encoding: utf-8
# 参照 custom/wanxiang_pro.custom.yaml 官方模板格式，采用增量路径补丁（slash-path / /+），
# 仅覆盖个人差异项，其余配置自动继承 wanxiang_pro.schema.yaml，确保上游新功能无缝集成。
patch:
  speller/algebra:
    __patch:
      #- wanxiang_algebra:/模糊音_nl
      #- wanxiang_algebra:/模糊音_ry
      #- wanxiang_algebra:/模糊音_hf
      #- wanxiang_algebra:/模糊音_rl
      #- wanxiang_algebra:/模糊音_kg
      #- wanxiang_algebra:/模糊音_en_eng
      #- wanxiang_algebra:/模糊音_in_ing
      #- wanxiang_algebra:/模糊音_c_ch
      #- wanxiang_algebra:/模糊音_z_zh
      #- wanxiang_algebra:/模糊音_s_sh
      - wanxiang_algebra:/pro/自然码
      # 可选输入方案名称：全拼，自然码，小鹤双拼，搜狗双拼，微软双拼，智能ABC，紫光双拼，国标双拼，拼音加加，乱序17，万象拼音，首道双拼，蓝天双拼，大牛双拼，自然龙，汉心龙
      - wanxiang_algebra:/自然码提权             # 自然码提权需置于直接辅助之前（直接辅助末尾含 erase/.*;.*/ 会擦除分号）
      - wanxiang_algebra:/pro/直接辅助
      # 辅助码升级为：直接辅助和间接辅助两种类型，都是句中任意，不同点在于直接辅助是nire=你 而间接则需要/引导 ni/re=你
      - wanxiang_algebra:/26jian
      #- wanxiang_algebra:/18jian
      #- wanxiang_algebra:/14jian
  ##########################以上格式受指令初始化控制，最好保持格式不变，如果发生变更请不要使用指令修改相关数据#####################################

  # 候选数量（7890 分别代表 1234 声，候选长度不要大于 6 避免冲突）
  menu/page_size: 6

  # 置顶词 dictionary 机制：指向根目录 custom_phrase_double.dict.yaml，与上游 custom_phrase.dict.yaml 隔离
  custom_phrase/dictionary: custom_phrase_double
  custom_phrase/prism: custom_phrase_double
  custom_phrase/enable_completion: false
  schema/dependencies/+:
    - wanxiang_phrase_double

  # 【自定义】独立标点转换，不随更新覆盖
  "engine/processors/@before 0": lua_processor@*custom_en_punct

  # 导入根目录下名称为 userzhj.dict.yaml 的自定义固定词典
  translator/packs/+:
    - userzhj

  # 用户词典设置：关闭上下文预测，开启长词组补全推荐
  user_dict_set/contextual_suggestions: false
  user_dict_set/enable_completion: true

  # orq / /rq 日期候选顺序（覆盖 schema 默认 date_formats）：
  # 1. 2026年08月17日  2. 2026-08-17  3. 20260817  4. 8月17日  其余依次后移
  date_formats:
    - "Y年m月d日"
    - "Y-m-d"
    - "Ymd"
    - "n月j日"
    - "Y/m/d"
    - "Y.m.d"
    - "Y年n月j日"
    - "y年n月j日"

  # 网址/文件输入优化：支持输入字母加点后不上屏，继续在输入框内输入
  "recognizer/patterns/url": "^[A-Za-z0-9]+[.].*$"

  # 英文自动加空格设置：关闭
  wanxiang_english/english_spacing: "off"
  wanxiang_english/spacing_timeout: 0

  # 超级注释模块：仅增量覆盖差异项，其余（如 tone_isolate、convert_abbrev_preedit 等）自动继承主方案
  super_comment/candidate_length: 2
  super_comment/cand_type/+:
    sentence: "∞"
    predict: "›"

  # 超级提示模块：仅覆盖禁用列表为全开，其余（tips_key: comma、files 等）自动继承主方案
  super_tips/disabled_types: []

  # 光标移动：本机 rime.dll（Weasel 0.17.4，2025-02）不支持上游的 *_no_loop 动作
  # （该组动作 librime 于 2025-11-29 才引入），继续使用会在启动时刷 invalid action 警告。
  # 改用带循环的 left_by_char / right_by_char：把 left_by_char_no_loop 换成单键叶子路径覆盖，
  # 避免整块替换 navigator/bindings 而丢掉 Shift+Left / Shift+Right 的音节跳转。
  navigator/bindings/Left: left_by_char
  navigator/bindings/Right: right_by_char

  # 成对符号包裹：仅增量覆盖个人保留项（上游将 r 改为了 |儿、v 改为了 〖〗），其余 90+ 项自动继承主方案
  paired_symbols/symkey/+:
    r: "〖〗" # 花括号扩展 / 装饰括号 (自定义保留，不转为儿化音)
    v: "❰❱"   # 装饰角括号 (自定义保留)

  # 标点符号覆盖
  punctuator/full_shape:
    __include: wanxiang_symbols:/symbol_table/full_shape
    "[": [「, 【, "[", "[]", 〔, ［]
    "]": [」, 】, "]", 〕, ］]
    "{": [『, 〖, "{}", ｛]

  punctuator/half_shape:
    __include: wanxiang_symbols:/symbol_table/half_shape
    "$": ["$", "￥", "¥"] # 中文直出半角美元，人民币符号退为备选
    "<": [<, "<>", 《, "<br>"]
    ">": [">", "<>", 》, "</br>"]
    "/": [/, ÷]
    '"': "“”"
    "`": ["`", "```", "``````", "``"]
    "(": ["（）", "（", "()"]
    ")": ["（）", "）", "()"]
    "[": ["[]", "[", "【"]
    "]": ["[]", "]", "】"]
    "{": ["{}", "{", "「"]
    "}": ["{}", "}", "」"]
